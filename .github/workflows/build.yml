name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: cd frontend && flutter pub get

      - name: Build APK
        run: cd frontend && flutter build apk --no-tree-shake-icons --dart-define=API_BASE_URL=https://datamind-api-yl0t.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datamind-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
